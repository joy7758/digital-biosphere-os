# This workflow will trigger Datadog Synthetic tests within your Datadog organisation
# For more information on running Synthetic tests within your GitHub workflows see: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# To get started:

# 1. Add your Datadog API (DD_API_KEY) and Application Key (DD_APP_KEY) as secrets to your GitHub repository. For more information, see: https://docs.datadoghq.com/account_management/api-app-keys/.
# 2. Start using the action within your workflow

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "digital-biosphere-architecture/site/**"
      - ".github/workflows/datadog-synthetics.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "digital-biosphere-architecture/site/**"
      - ".github/workflows/datadog-synthetics.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY_CONFIGURED: ${{ secrets.DD_API_KEY != '' }}
      DD_APP_KEY_CONFIGURED: ${{ secrets.DD_APP_KEY != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: digital-biosphere-architecture/site/package-lock.json

    - name: Install website dependencies
      working-directory: digital-biosphere-architecture/site
      run: npm ci

    - name: Test and build website
      working-directory: digital-biosphere-architecture/site
      run: npm test

    - name: Lint website
      working-directory: digital-biosphere-architecture/site
      run: npm run lint

    - name: Audit production dependencies
      working-directory: digital-biosphere-architecture/site
      run: npm audit --omit=dev

    # Run Synthetic tests within your GitHub workflow.
    # For additional configuration options visit the action within the marketplace: https://github.com/marketplace/actions/datadog-synthetics-ci
    - name: Run Datadog Synthetic tests
      if: env.DD_API_KEY_CONFIGURED == 'true' && env.DD_APP_KEY_CONFIGURED == 'true'
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
      with:
        api_key: ${{secrets.DD_API_KEY}}
        app_key: ${{secrets.DD_APP_KEY}}
        test_search_query: 'tag:e2e-tests' #Modify this tag to suit your tagging strategy

    - name: Record unavailable Datadog configuration
      if: env.DD_API_KEY_CONFIGURED != 'true' || env.DD_APP_KEY_CONFIGURED != 'true'
      run: |
        echo "::notice::DATADOG_SYNTHETICS_NOT_ASSESSED_MISSING_CONFIGURATION"
        echo "Datadog Synthetic tests were not executed because one or both repository secrets are absent."
