  experiment_status: "registered"
  procedure_status: "procedure_defined"
  authorization_status: "pending"
  readiness_status: "pending"
  execution_status: "not_executed"
  current_gate: "G1_registered_procedure_defined_G2_blocked_inputs_pending"
  fact_formation_status: "not_formed"
  authority_effect: "none"
  rules:
    - "Registration records identity and protocol only; it does not execute any of the eight procedure steps."
    - "All three declared inputs remain pending until canonical material, digests, timestamps, and evidence are frozen."
    - "All six outputs remain expected with null artifact and evidence references."
    - "All four stop rules remain defined and unevaluated."
    - "The pending authorization has authorized_by=null and grants no permission, runtime, write, event, evidence, or verification authority."
    - "All five readiness criteria remain pending; the snapshot and validator manifest are not frozen, the environment is not active, and authorization is not granted."

fact_formation_mapping:
  relation: "Experiment -> Fact Formation"
  interpretation: "DBOS-EXP-0001 defines a future route to fact formation through authorization, execution context, event provenance, integrity, attestation, evidence, and verification; registration alone forms no fact."
  status: "registered_genesis_experiment_not_authorized"
  authority_effect: "none"
  automatic_fact_formation: false

