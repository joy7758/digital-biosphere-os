  runner_execution_count: 0
  runner_evidence_count: 0
  event_count: 0
  runtime_instance_count: 0
  capability_count: 0
  permission_grant_count: 0
  agent_created_count: 0
  digital_organism_count: 0
  c_e_v_level_change_count: 0
