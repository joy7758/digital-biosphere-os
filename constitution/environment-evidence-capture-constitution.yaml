schema_version: "0.1"
kind: "DigitalBiosphereEnvironmentEvidenceCaptureConstitution"
metadata:
  title: "Environment Evidence Capture Constitution v0.1"
  chinese_title: "环境证据采集宪法 v0.1"
  status: "capture_model_defined_no_environment_material_collected"
  parent_constitution: "constitution.yaml"
  environment_qualification_reference: "environment-qualification-constitution.yaml"
  environment_collector_reference: "environment-collector-constitution.yaml"
  execution_context_reference: "execution-context-constitution.yaml"
  automated_runner_reference: "automated-runner-constitution.yaml"
  freeze_reference: "experiment-freeze-constitution.yaml"
  authority: "environment_evidence_collection_structure_only"
  effective_scope:
    - "/Users/zhangbin/GitHub/digital-biosphere-os"
  adopted_at: "2026-07-20T09:23:44+08:00"
  non_claims:
    - "This constitution does not collect environment material, qualify or freeze an environment, create a Runner, execute an experiment, or create a Runtime or Agent."
    - "Capture Registration != Evidence Collection != Evidence Verification != Environment Qualification."
    - "A fact value or digest cannot grant capability, permission, trust, execution authority, or C/E/V promotion."

evidence_collection:
  capture_registry: "../registry/environment-evidence-captures.yaml"
  fact_registry: "../registry/environment-facts.yaml"
  digest_registry: "../registry/environment-digests.yaml"
  collection_evidence_registry: "../registry/environment-collection-evidence.yaml"
  requirements:
    - "capture_id is unique and references one existing environment identity"
    - "collector remains null until a separately governed attributable collector is enrolled and authorized"
    - "timestamp remains null until collection actually occurs"
    - "facts, digests, and collection evidence are linked explicitly and belong to the same environment and capture"
    - "partial, failed, excluded, unavailable, and unknown observations are retained rather than silently omitted"
  lifecycle_states:
    - "pending"
    - "collecting"
    - "collected"
    - "validated"
    - "partial"
    - "invalid"
    - "revoked"
  current_status: "pending"
  automatic_collection: false

collector_dependency:
  constitution_ref: "environment-collector-constitution.yaml"
  collector_registry: "../registry/environment-collectors.yaml"
  scope_registry: "../registry/collector-scopes.yaml"
  run_registry: "../registry/collector-runs.yaml"
  collector_evidence_registry: "../registry/collector-evidence.yaml"
  requirements:
    - "Environment collection may begin only through an explicitly registered automated Collector with an existing governed identity."
    - "The Collector uses access_mode=read_only and an approved scope for the same environment."
    - "allowed_facts is limited to operating_system, python_version, dependency_information, and configuration_information."
    - "credential, secret, private_key, personal_data, and external_storage_content remain excluded."
    - "One attributable Collector run links the pending capture, facts, digests, method, timestamps, outputs, and limitations."
    - "Collector evidence cannot automatically create environment qualification evidence or change qualification or lock state."
  current_collector_count: 0
  current_scope_count: 0
  current_run_count: 0
  current_collector_evidence_count: 0
  current_capture_status: "pending"
  automatic_collector_enrollment: false
  automatic_collection_authorization: false
  authority_effect: "none"

evidence_source:
  principle: "Every environment fact and digest must retain an attributable source and collection method; a value without provenance is invalid."
  permitted_source_classes:
    - "operating_system_inventory"
    - "python_runtime_inventory"
    - "dependency_manifest"
    - "configuration_manifest"
    - "hardware_inventory"
  rules:
    - "source references exact retained material or a bounded deterministic collection method"
    - "repository names, process names, defaults, directory structure, and developer recollection are not environment facts"
    - "member repositories and external systems remain out of scope unless separately authorized"
    - "unavailable source material is recorded as unavailable and cannot be replaced with an assumption"

evidence_integrity:
  digest_registry: "../registry/environment-digests.yaml"
  hash_algorithm: "sha256"
  hash_value_format: "sha256:<64 lowercase hexadecimal characters>"
  rules:
    - "dependency, configuration, and aggregate environment digests use canonicalized retained inputs"
    - "hash_value must be non-empty and format-valid before a digest record can be marked verified"
    - "digest verification checks byte consistency only and does not prove completeness, correctness, safety, or qualification"
    - "correction, invalidation, supersession, and revocation are append-only"
  current_digest_count: 0

collection_boundary:
  allowed:
    - "define a pending bounded collection request"
    - "record future attributable OS, Python, dependency, configuration, and hardware facts"
    - "record future dependency, configuration, and aggregate environment digests"
    - "record future collection method, source, result, and timestamp evidence"
  forbidden:
    - "qualify or freeze an environment"
    - "populate environment-qualification evidence automatically"
    - "create or register a Runner, Runtime, Agent, or Digital Organism"
    - "execute DBOS-EXP-0001 or generate an Event or Snapshot"
    - "modify a member repository or external system"
    - "grant capability, permission, trust, fitness, or C/E/V promotion"
  invariant: "Collected Material != Verified Evidence != Qualified Environment != Frozen Environment."

privacy_protection:
  principle: "Collect the minimum environment metadata necessary for bounded reproducibility while excluding secrets, personal data, and unrelated filesystem content."
  prohibited_content:
    - "credentials, API keys, tokens, cookies, private keys, or authentication material"
    - "personal communications, unrelated documents, browser data, or private user content"
    - "environment-variable values not explicitly allowlisted as non-sensitive"
    - "raw member-repository content outside the declared DBOS scope"
  handling_rules:
    - "record version and digest metadata instead of secret-bearing raw configuration where possible"
    - "redaction and exclusion rules are explicit and become part of collection evidence"
    - "sensitive discovery stops collection and records a bounded failure without retaining the secret"
    - "retention, access, deletion, and disclosure remain subject to separate policy and authorization"

current_baseline:
  environment_count: 1
  capture_count: 1
  pending_capture_count: 1
  collected_capture_count: 0
  environment_collector_count: 0
  environment_collector_scope_count: 0
  environment_collector_run_count: 0
  environment_collector_evidence_count: 0
  environment_fact_count: 0
  environment_digest_count: 0
  collection_evidence_count: 0
  qualification_evidence_count: 0
  qualified_environment_count: 0
  frozen_environment_count: 0
  runner_count: 0
  experiment_execution_count: 0
  event_count: 0
  snapshot_hash_count: 0
  runtime_instance_count: 0
  agent_created_count: 0
  capability_count: 0
  permission_grant_count: 0
  c_e_v_level_change_count: 0
