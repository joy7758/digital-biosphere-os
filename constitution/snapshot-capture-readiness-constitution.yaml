schema_version: "0.1"
kind: "DigitalBiosphereSnapshotCaptureReadinessConstitution"
metadata:
  title: "Snapshot Capture Readiness Constitution v0.1"
  chinese_title: "实验快照捕获就绪宪法 v0.1"
  status: "capture_readiness_defined_all_criteria_pending"
  parent_constitution: "constitution.yaml"
  snapshot_capture_reference: "snapshot-capture-constitution.yaml"
  experiment_freeze_reference: "experiment-freeze-constitution.yaml"
  experiment_readiness_reference: "experiment-readiness-constitution.yaml"
  executor_reference: "executor-constitution.yaml"
  authority: "capture_pre_execution_readiness_structure_and_validation_only"
  effective_scope:
    - "/Users/zhangbin/GitHub/digital-biosphere-os"
  adopted_at: "2026-07-20T02:00:37+08:00"
  non_claims:
    - "This constitution defines capture-readiness gates but does not appoint a collector, authorize capture, run a capture, generate a hash, freeze a snapshot, or execute an experiment."
    - "A defined scope and pending authorization record cannot create filesystem, repository, network, storage, privacy, capability, permission, runtime, Agent, event, or C/E/V authority."
    - "Capture Readiness != Capture Authorization != Capture Execution != Experiment Authorization != Experiment Execution."

collector_identity:
  source_of_truth: "../registry/capture-collectors.yaml"
  valid_types:
    human: "An attributable human identity acting under an explicit bounded capture authorization."
    automated: "An attributable governed service or automated process with an existing identity, declared deterministic method, and bounded authorization."
  requirements:
    - "unique collector_id"
    - "collector_type is human or automated"
    - "identity_ref resolves to an existing governed identity record"
    - "method is explicit, deterministic where applicable, and bounded to the approved scope"
    - "status is verified or active before authorization may be granted"
  separation_rules:
    - "Collector Identity != Agent Identity."
    - "Automated Collector != Autonomous Agent."
    - "Collector Registration != Capture Authorization."
  current_collector_count: 0
  current_status: "missing"

capture_authorization:
  source_of_truth: "../registry/capture-authorizations.yaml"
  requirements:
    - "authorization references DBOS-EXP-0001"
    - "collector_id resolves to a verified or active collector"
    - "scope_ref resolves to one defined or approved capture scope"
    - "authorized_by is separately attributable and decision_at is timezone-aware"
    - "authorization limitations explicitly prohibit experiment execution, events, runtimes, Agents, member-repository access, and C/E/V promotion"
  non_inference:
    - "Experiment Registration != Capture Authorization."
    - "Experiment Authorization != Capture Authorization."
    - "Scope Definition != Authorization Grant."
    - "Validator PASS != Authorization Grant."
  current_status: "pending"
  current_effect: "none"

capture_scope:
  source_of_truth: "../registry/capture-scopes.yaml"
  principle: "Capture is deny-by-default and constrained by one explicit allowlist rooted at digital-biosphere-os plus a mandatory exclusion list."
  requirements:
    - "scope references the registered experiment"
    - "included_paths is non-empty, normalized, relative to the DBOS root, and resolves inside that root"
    - "excluded_paths is non-empty and identifies member repositories, parent paths, credentials, secrets, generated bytecode, Git metadata, and unapproved external storage"
    - "exclusions override inclusions"
    - "scope change creates a successor record and requires new authorization"
  current_scope_count: 1
  current_status: "defined"

exclusion_rules:
  precedence: "deny_overrides_allow"
  mandatory_categories:
    - "paths outside /Users/zhangbin/GitHub/digital-biosphere-os"
    - "member repositories and sibling repositories"
    - ".git metadata and unavailable repository history"
    - "environment files, secrets, credentials, tokens, keys, and private account data"
    - "generated bytecode, caches, temporary files, sockets, and device files"
    - "dataless or non-materialized File Provider objects until bytes are locally available and separately reviewed"
    - "external storage without separate access authorization"
  symlink_rule: "A symlink target outside the approved root is excluded even if the link path appears inside an included directory."
  current_exclusion_review: "pending"

privacy_boundary:
  principle: "Capture must minimize personal, secret, credential, account, and unrelated user data. A digest can itself expose path and inventory metadata and therefore remains governed evidence."
  requirements:
    - "perform a pre-capture privacy and secret-path review"
    - "exclude or redact unauthorized personal and secret material before hashing"
    - "record exclusions without copying excluded bytes"
    - "avoid absolute-path disclosure outside the bounded governance record"
    - "retain digests and evidence only under declared retention rules"
    - "privacy approval does not grant access to otherwise unauthorized data"
  current_privacy_evidence: null
  current_status: "pending"

readiness_review:
  source_of_truth: "../registry/capture-readiness-reviews.yaml"
  required_criteria:
    - "collector"
    - "scope"
    - "authorization"
    - "privacy"
  valid_statuses:
    - "pending"
    - "ready"
    - "not_ready"
    - "invalid"
    - "revoked"
  ready_gate: "All four criteria require sufficient attributable evidence. Aggregate readiness never creates capture or experiment authority."
  current_distribution:
    pending: 4
    ready: 0
    not_ready: 0
    invalid: 0
    revoked: 0
  current_status: "pending"
  capture_effect: "none"

collector_executor_separation:
  principle: "Snapshot Collector and Experiment Executor are separate accountable roles with separate scopes and authorizations, even if a future governed identity is explicitly approved for both roles."
  rules:
    - "Collector != Executor."
    - "Capture Authorization != Executor Authorization."
    - "Collector registration cannot appoint or authorize an Executor."
    - "Executor registration cannot appoint or authorize a Collector."
    - "Capture readiness can supply a pre-execution dependency but cannot grant experiment execution authority."
    - "No role may infer the other role from identity, verifier status, service status, method, filesystem access, or local validator PASS."
  independence_requirement: "Any future dual-role identity requires two explicit role records, two non-overlapping scopes, two separate authorization decisions, and an accountability review for self-production or evidence-conflict risk."
  current_collector_count: 0
  current_executor_count: 0
  current_separation_status: "no_roles_appointed"
  authority_effect: "none"

current_baseline:
  collector_count: 0
  verified_collector_count: 0
  scope_count: 1
  defined_scope_count: 1
  capture_authorization_count: 1
  active_capture_authorization_count: 0
  capture_readiness_review_count: 4
  pending_readiness_review_count: 4
  ready_readiness_review_count: 0
  executor_count: 0
  executor_scope_count: 0
  active_executor_authorization_count: 0
  snapshot_capture_count: 1
  completed_capture_count: 0
  artifact_digest_count: 0
  snapshot_hash_count: 0
  event_count: 0
  runtime_instance_count: 0
  agent_created_count: 0
  capability_count: 0
  permission_grant_count: 0
  c_e_v_level_change_count: 0
