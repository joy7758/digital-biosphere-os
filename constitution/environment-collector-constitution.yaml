schema_version: "0.1"
kind: "DigitalBiosphereAutomatedEnvironmentCollectorConstitution"
metadata:
  title: "Automated Environment Collector Constitution v0.1"
  chinese_title: "自动环境证据采集器宪法 v0.1"
  status: "collector_model_defined_no_collector_or_run"
  parent_constitution: "constitution.yaml"
  identity_reference: "identity-constitution.yaml"
  environment_evidence_capture_reference: "environment-evidence-capture-constitution.yaml"
  environment_qualification_reference: "environment-qualification-constitution.yaml"
  executor_reference: "executor-constitution.yaml"
  runner_reference: "automated-runner-constitution.yaml"
  permission_policy_reference: "../policies/permissions.yaml"
  authority: "read_only_collector_structure_and_validation_only"
  effective_scope:
    - "/Users/zhangbin/GitHub/digital-biosphere-os"
  adopted_at: "2026-07-20T09:37:43+08:00"
  non_claims:
    - "This constitution does not enroll a Collector, authorize or run collection, collect an environment fact, qualify or freeze an environment, create a Runner, execute an experiment, or create a Runtime or Agent."
    - "Collector != Agent; Collector != Executor; Collector != Runner; Collector != Runtime; Collector != Digital Organism."
    - "Collector Identity != Collector Scope != Collector Run != Collector Evidence != Environment Qualification."

collector_definition:
  definition: "An Automated Environment Collector is a separately identified, versioned, deterministic, read-only process that may inspect only explicitly scoped local environment metadata and emit attributable evidence records without autonomous planning or authority."
  collector_type: "automated"
  identity_source: "../registry/entities.yaml"
  source_of_truth: "../registry/environment-collectors.yaml"
  identity_requirements:
    - "collector_id is unique"
    - "identity_ref resolves to an existing governed entity identity"
    - "the referenced identity is not an Agent, Executor, Runner, Runtime, or Organism"
    - "method is explicit, deterministic, versioned, and inspectable"
    - "access_mode is read_only"
    - "registration, identity, scope, collection, evidence, verification, qualification, and authorization remain separate states"
  separation_rules:
    - "Collector != Agent."
    - "Collector != Executor."
    - "Collector != Runtime."
    - "Collector != Capability."
    - "Collector != Permission."
    - "Existing Service, Verifier, Runner, script, process, repository, or tool name != Collector Registration."
  current_collector_count: 0
  current_status: "missing"

read_only_principle:
  access_mode: "read_only"
  allowed_operations:
    - "read bounded operating-system identity and version metadata"
    - "read bounded Python implementation and version metadata"
    - "read declared dependency names, versions, sources, and lock material"
    - "read allowlisted non-secret configuration identity and digest inputs"
    - "read minimal non-sensitive hardware architecture, logical CPU count, and memory-size metadata"
    - "calculate deterministic digests from explicitly retained allowed inputs"
    - "emit new append-only fact, digest, run, and evidence records only inside the experiment evidence boundary"
  prohibited_operations:
    - "write, rename, delete, chmod, install, upgrade, or mutate files or dependencies outside the experiment evidence boundary"
    - "modify or delete any pre-existing evidence artifact"
    - "modify constitution, registry history, member repositories, or external projects"
    - "invoke network, cloud, external storage, credential store, browser, or account actions"
    - "create Agent, Runtime, Runner, Executor, Event, Snapshot, Capability, Permission, or Digital Organism"
    - "execute DBOS-EXP-0001 or any registered procedure step"
    - "qualify, freeze, activate, authorize, or promote an environment"
  fail_closed_rule: "Any operation outside the approved read-only scope stops collection and produces no success, verified, qualification, or authorization claim."

collection_boundary:
  scope_source_of_truth: "../registry/collector-scopes.yaml"
  allowed_fact_catalog:
    - "operating_system"
    - "python_version"
    - "dependency_information"
    - "configuration_information"
    - "hardware_information"
  mandatory_excluded_data:
    - "credential"
    - "secret"
    - "private_key"
    - "personal_data"
    - "external_storage_content"
  requirements:
    - "one Collector uses only one explicit approved scope per run"
    - "allowed_facts is a non-empty subset of the catalog"
    - "excluded_data contains every mandatory exclusion"
    - "environment identity and local source boundary are explicit"
    - "unknown, unavailable, excluded, partial, and failed observations remain explicit"
  current_scope_count: 0

evidence_generation:
  run_registry: "../registry/collector-runs.yaml"
  collector_evidence_registry: "../registry/collector-evidence.yaml"
  fact_registry: "../registry/environment-facts.yaml"
  digest_registry: "../registry/environment-digests.yaml"
  collection_evidence_registry: "../registry/environment-collection-evidence.yaml"
  requirements:
    - "every fact and digest traces to one completed Collector run, Collector identity, scope, environment, method, source, and timestamp"
    - "run output_refs contain only evidence artifacts actually created by that run"
    - "Collector evidence references retained facts and digests and cannot substitute for their sources"
    - "digest verification proves bounded byte consistency only"
    - "Collector evidence enters qualification only through separate evidence validation and qualification review"
  automatic_environment_evidence_creation: false
  automatic_environment_qualification: false
  current_run_count: 0
  current_collector_evidence_count: 0

privacy_boundary:
  principle: "The Collector minimizes data and fails closed before reading, retaining, hashing, or emitting prohibited sensitive content."
  mandatory_exclusions:
    - "credential"
    - "secret"
    - "private_key"
    - "personal_data"
    - "external_storage_content"
  rules:
    - "configuration collection uses an explicit non-sensitive allowlist and records keys or digests rather than secret-bearing values"
    - "environment-variable values are excluded unless separately classified as non-sensitive and explicitly allowlisted"
    - "home-directory, browser, account, keychain, mail, cloud, and unrelated document traversal is prohibited"
    - "sensitive discovery stops the run without retaining the sensitive value"
    - "privacy exclusions and collection limitations are retained in evidence"

revocation:
  principle: "Collector revocation is append-only, stops future collection eligibility, and preserves prior identity, scope, run, fact, digest, evidence, limitation, and revocation records."
  requirements:
    - "record attributable revoker, reason, timestamp, and affected scope"
    - "do not delete or rewrite prior Collector runs or evidence"
    - "do not reinterpret prior evidence beyond its recorded method and scope"
    - "re-enrollment requires a new identity or versioned succession record and a new scope review"
  automatic_revocation: false
  authority_effect: "none"

current_baseline:
  collector_count: 0
  automated_collector_count: 0
  read_only_collector_count: 0
  collector_scope_count: 0
  collector_run_count: 0
  collector_evidence_count: 0
  environment_evidence_capture_count: 1
  pending_environment_evidence_capture_count: 1
  environment_fact_count: 0
  environment_digest_count: 0
  environment_collection_evidence_count: 0
  qualification_evidence_count: 0
  qualified_environment_count: 0
  frozen_environment_count: 0
  runner_count: 0
  experiment_execution_count: 0
  event_count: 0
  snapshot_hash_count: 0
  runtime_instance_count: 0
  agent_created_count: 0
  capability_count: 0
  permission_grant_count: 0
  c_e_v_level_change_count: 0
