[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-biosphere-os-preview"
version = "0.1.0.dev0"
description = "Installable Developer Preview candidate for bounded DBOS object contracts and validation"
readme = "docs/developer-quickstart.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
  "PyYAML>=6.0,<7",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
dbos-validate = "validator.object_schema_validator:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "dbos*", "schemas*", "sdk*", "validator*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
schemas = ["*.yaml"]
"dbos.telemetry_admission" = [
  "migrations/*.sql",
  "profiles/*.json",
  "profiles/*.md",
  "profiles/*.yaml",
]
