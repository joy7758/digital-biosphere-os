      "principle_id": "resource_balance",
      "name": "Resource Balance",
      "description": "Resource use is evaluated across entities and time rather than optimized for one entity without regard to externalities.",
      "affected_layer": "Ecology",
      "constraint": "Future selection must account for resource limits, attribution, shared dependencies, recovery, and ecosystem stability."
    },
