      "principle_id": "ecological_diversity",
      "name": "Ecological Diversity",
      "description": "The ecosystem preserves multiple roles, implementations, lineages, and recovery options where evidence supports them.",
      "affected_layer": "Ecology",
      "constraint": "Selection cannot treat concentration, monoculture, or removal of independent lineage as fitness improvement without stability evidence."
