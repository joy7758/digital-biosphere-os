      "name": "Identity Preservation",
      "description": "Evolution preserves canonical subject identity or records an explicit successor, retirement, and lineage transition.",
      "affected_layer": "Identity",
      "constraint": "No mutation may erase, silently replace, merge, or reassign identity; identity changes require additive lineage evidence."
