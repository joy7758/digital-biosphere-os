      "name": "Evidence Preservation",
      "description": "Evolution memory is retained through attributable, append-only evidence, verification, and revocation history.",
      "affected_layer": "Evidence",
      "constraint": "Historical evidence cannot be deleted, overwritten, detached, or rewritten; corrections and invalidations must be additive."
    },
    {
      "principle_id": "adaptive_improvement",
      "name": "Adaptive Improvement",
      "description": "Proposed changes may improve fit to an environment when their scope, evidence, effects, and governance gates remain explicit.",
      "affected_layer": "Evolution",
      "constraint": "Adaptation remains a proposal until existing identity, capability, evidence, verification, and permission rules are satisfied."
